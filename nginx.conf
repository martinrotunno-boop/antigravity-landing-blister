server {
    # Puerto 3000 a proposito: es el que ya tiene configurado el servicio de
    # Easypanel desde la version React. Asi el cambio de stack no requiere
    # tocar nada en el panel.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing de una sola pagina: cualquier ruta desconocida cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js lleva la URL del webhook y el sitekey de Turnstile. Si cambian,
    # el navegador tiene que verlo enseguida y no servir una copia cacheada.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Fuentes, iconos y logos: cambian poco y pesan.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
